
name: Test Blue Archive Firestore Format

on:
  workflow_dispatch:

jobs:
  test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Firestore document format
        run: python test_bluearchive_firestore_format.py
