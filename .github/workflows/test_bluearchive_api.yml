
name: Test Blue Archive API

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test official news API
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://api-web.bluearchive.jp/api/news/list"
              "?typeId=0&pageNum=6&pageIndex=1"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)

          print("API success:", data.get("meta", {}).get("ok"))
          rows = data.get("data", {}).get("rows", [])
          print("News count:", len(rows))

          for item in rows:
              print(
                  "ID:", item.get("id"),
                  "| Type:", item.get("typeId"),
                  "| Summary:", item.get("summary"),
              )
          PY
