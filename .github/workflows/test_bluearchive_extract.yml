
name: Test Blue Archive Extract

on:
  workflow_dispatch:

jobs:
  test-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Blue Archive events
        run: python test_bluearchive_extract.py
