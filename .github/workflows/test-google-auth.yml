
name: Test Google Cloud Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/387235521140/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: game-event-collector@game-event-manager-7a8bd.iam.gserviceaccount.com
          token_format: access_token

      - name: Confirm authentication
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "Google Cloud authentication: SUCCESS"
          else
            echo "Google Cloud authentication: FAILED"
            exit 1
          fi
